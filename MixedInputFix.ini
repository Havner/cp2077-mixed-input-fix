; MixedInputFix configuration. Optional - delete this file for defaults.
; Place next to MixedInputFix.dll:
;   <game>/red4ext/plugins/MixedInputFix/MixedInputFix.ini

; Master switch. false = plugin loads but attaches nothing (game runs vanilla).
enabled = true

; Which device the UI is pinned to:
;   controller (default) - UI locks to the gamepad after its first input.
;     For gamepad-primary setups with emulated/auxiliary mouse (Steam
;     Controller, Steam Deck, gyro aim). Vanilla until a gamepad is used.
;   kbm - UI locks to keyboard/mouse from boot. For KBM-primary setups with
;     auxiliary analog inputs (e.g. movement/driving on a stick).
; Both stop the hint flicker and the mixed-input freeze.
mode = controller

; Chatty per-event logging (device transitions, suppression/override counters).
; Off by default; the log always contains the startup banner, the first
; gamepad detection, [fallback] warnings and a session summary on exit.
verbose = false
